name: Continuous Integration

permissions:
  contents: read

on:
  push:
    branches:
      - "**"
    tags:
      - "!**" # Don't run twice on commits with tags
    paths-ignore:
      - "scripts/**"
      - "**.md"
  pull_request:
  schedule:
    - cron: "15 6 * * 2"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Init Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run fmt
        run: cargo fmt -- --check

      - name: Run check
        run: cargo check --all-features --all-targets

      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run test
        run: cargo test --all-features --all-targets

      - name: Run test doc
        run: cargo test --doc

      - name: Build docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit

      - name: Install Cargo Coverage
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cargo Coverage
        run: cargo llvm-cov test --all-features --tests --lcov --output-path ./lcov.info

      - name: Upload Coverage
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  msrv:
    name: "MSRV"
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The toolchain comes from `rust-version` in Cargo.toml, so raising the MSRV
      # is a single edit. It's installed with rustup rather than with a version tag
      # of dtolnay/rust-toolchain, because Dependabot treats such a tag as a version
      # to bump (1.85 → a nonexistent 1.120).
      #
      # `RUSTUP_TOOLCHAIN` is what actually pins the check: rust-toolchain.toml
      # selects `stable` and outranks `rustup default`, so without it `cargo check`
      # would run on stable and pass whatever `rust-version` says.
      - name: Install Rust (MSRV)
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          [ -n "$msrv" ] || { echo "::error::no rust-version found in Cargo.toml"; exit 1; }
          echo "MSRV from Cargo.toml: $msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"

      - name: Show Rust version
        run: rustc --version

      - name: Init Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}

      - name: Run check
        run: cargo check --all-features --all-targets
