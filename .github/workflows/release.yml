name: Release Binaries

permissions:
  contents: write
  id-token: write
  pages: write

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}

jobs:
  check-release:
    name: Check release
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Uploads use --clobber, so refuse to run unless the release for the
      # current version is a single, unpublished draft.
      - name: Ensure release is a draft
        run: |
          TAG="v$(scripts/get_version.sh)"
          DRAFTS=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .draft")
          if [ "$DRAFTS" != "true" ]; then
            echo "::error::Expected exactly one draft release for $TAG, found: [${DRAFTS//$'\n'/, }]"
            exit 1
          fi

  release-linux:
    name: release ${{ matrix.target }}
    needs: check-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
          - target: aarch64-unknown-linux-musl
          - target: x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download cross
        run: |
          curl -L https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-gnu.tar.gz \
            -o cross-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf cross-x86_64-unknown-linux-gnu.tar.gz
          sudo mv cross /usr/local/bin/cross
          sudo chmod +x /usr/local/bin/cross

      - name: Build with Cross
        run: cross build --release --bins --target ${{ matrix.target }}

      - name: Archive
        run: tar -czf ${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release versatiles_glyphs

      - name: Upload
        run: gh release upload "v$(scripts/get_version.sh)" ${{ matrix.target }}.tar.gz --clobber

  release-mac:
    name: release ${{ matrix.target }}
    needs: check-release
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Add Target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --bins --target ${{ matrix.target }}

      - name: Archive
        run: tar -czf ${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release versatiles_glyphs

      - name: Upload
        run: gh release upload "v$(scripts/get_version.sh)" ${{ matrix.target }}.tar.gz --clobber

  finish-release:
    name: Finish release # The end is but the start of a new journey.
    needs:
      - release-linux
      - release-mac
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Finalize the release # The final stroke of the brush completes the masterpiece.
        run: gh release edit "v$(scripts/get_version.sh)" --draft=false --latest --prerelease=false

      # The tap reads the published release itself; this only tells it to. PAT_TOKEN because
      # github.token cannot start a workflow in another repository.
      - name: Update the Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: gh workflow run update_formula_glyphs.yml --repo versatiles-org/homebrew-versatiles --ref main

  pages:
    name: Pages
    needs: finish-release
    uses: ./.github/workflows/pages.yml
