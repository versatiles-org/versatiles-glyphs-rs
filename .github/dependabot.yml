version: 2
updates:
  # Dependabot allows only one entry per ecosystem and directory. Security updates don't
  # depend on the schedule: they are opened as soon as an advisory is published (enabled in
  # the repository settings) and grouped by the `security` group.

  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    groups:
      cargo: { patterns: ['*'] }
      security: { applies-to: security-updates, patterns: ['*'] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      github-action: { patterns: ['*'] }
      security: { applies-to: security-updates, patterns: ['*'] }
