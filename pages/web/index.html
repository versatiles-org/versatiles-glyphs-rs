<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<script src="./assets/lib/maplibre-gl/maplibre-gl.js"></script>
		<script src="./assets/lib/versatiles-style/versatiles-style.js"></script>
		<script src="./assets/labels.js"></script>
		<link href="./assets/lib/maplibre-gl/maplibre-gl.css" rel="stylesheet" />
	</head>
	<body>
		<h1>Test Glyphs</h1>
		<p>
			<a href="sdf-step.html">Compare <code>--sdf-step</code> values</a>
		</p>
		<div id="map" style="width: 800px; height: 800px; margin: auto"></div>
		<script>
			const style = VersaTilesStyle.colorful({
				baseUrl: 'https://tiles.versatiles.org',
			})

			const url = new URL('./assets/glyphs', document.URL)
			url.hash = ''
			style.glyphs = url.href + '/{fontstack}/{range}.pbf'
			//style.glyphs = 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf'
			//style.glyphs = 'https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf'
			const fontname = 'noto_sans_regular'
			//const fontname = 'Noto Sans Regular';

			style.sources.testdata = {
				type: 'geojson',
				data: {
					type: 'FeatureCollection',
					// Texts to test are defined in assets/labels.js
					features: TEST_LABELS.map((text, i) => ({
						type: 'Feature',
						geometry: {
							type: 'Point',
							coordinates: [0, -i * 0.2],
						},
						properties: { text },
					})),
				},
			}

			function getExp(v) {
				return [
					'interpolate',
					['exponential', 2],
					['zoom'],
					6,
					v,
					14,
					v * 256,
				]
			}

			style.layers.push({
				id: 'testdata-labels',
				type: 'symbol',
				source: 'testdata',
				minzoom: 6,
				layout: {
					'text-field': '{text}',
					'text-size': getExp(10),
					'text-overlap': 'always',
					'text-font': [fontname],
					'text-anchor': 'left',
					'text-justify': 'left',
				},
				paint: {
					'text-color': '#000',
					'text-halo-color': '#FFF',
					'text-halo-width': getExp(1),
				},
			})

			style.layers.push({
				type: 'circle',
				id: 'testdata-points',
				source: 'testdata',
				minzoom: 6,
				paint: { 'circle-radius': 2, 'circle-color': '#C00' },
			})

			maplibregl.setRTLTextPlugin(
				'./assets/lib/mapbox-gl-rtl-text/mapbox-gl-rtl-text.js',
				true,
			)

			const map = new maplibregl.Map({
				container: 'map',
				style,
				maxzoom: 16,
				bounds: [
					[-0.1, -2.5],
					[2.5, 0.2],
				],
			})

			// enable hash separately so it doesn't change the url directly on load
			new maplibregl.Hash().addTo(map)
		</script>
	</body>
</html>
